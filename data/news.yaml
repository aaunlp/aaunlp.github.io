- date: 2026-11-02
  label: "People"
  title: "Marcell Fekete and Yiyi Chen begin postdoctoral positions"
  text: "Congratulations to Marcell Fekete and Yiyi Chen, who have both successfully defended their PhDs in AAU NLP and started postdoctoral positions on 1 November 2026. Their research spans linguistic structure in language models and security vulnerabilities in multilingual and multimodal embeddings. Marcell’s DFF International Postdoc fellowship, “Fast and Focused,” explores information-structure-aware AI for accessibility."
  url: "/people/"

- date: 2026-11-02
  label: "Publications"
  title: "AAU NLP papers accepted at CCS and NeurIPS 2026"
  text: "Two papers examine privacy risks in machine learning. “When Topology Betrays Privacy,” accepted at CCS 2026, investigates reconstruction attacks on secure aggregation in decentralized federated learning. “Characterizing Memorization in Diffusion Language Models,” accepted at NeurIPS 2026, studies training-data extraction and how sampling choices affect memorization."
  url: "/publications/?year=2026"

- date: 2026-11-02
  label: "People"
  title: "Ivaylo Mitov joins AAU NLP"
  text: "Ivaylo Mitov joined the group as a PhD fellow on 1 October 2026. He is part of LM²-SEC, our Novo Nordisk Foundation-funded programme on linguistically motivated language-model security."
  url: "/people/#ivaylo-mitov"

- date: 2026-09-04
  label: People
  title: Six new researchers join AAU NLP
  text: Since 1 June, Ren Tao, Anahita Baninajjar, Dorielle Lonke, Anna Lackner, Davis Davalos-DeLosh, and Lena Pickartz have joined the group, strengthening our work in linguistics, trustworthy AI, and language-model security.
  url: /people/

- date: 2026-08-24
  label: Publications
  title: Five papers at EMNLP 2026
  text: Four Main Conference papers span multilingual language modelling, vision-language models, embedding security, and epistemic diversity. They include Tao's first paper and the final PhD thesis papers for Marcell and Yiyi. A fifth contribution was accepted to the System Demonstrations track.
  url: /publications/?q=EMNLP&year=2026

- date: 2026-05-01
  label: Projects
  title: Two new programmes begin
  text: TRUST and Formal Semantic Methods for AI Safety strengthen the group's work on model integrity, formal semantics, multilingual failure analysis, and explainable safeguards.
  url: /projects/

- date: 2026-03-01
  label: Publication
  title: Typologically principled evaluation in Computational Linguistics
  text: A Principled Framework for Evaluating on Typologically Diverse Languages provides reproducible tools for choosing language samples and testing generalisability.
  url: https://aclanthology.org/2026.cl-1.7/

- date: 2026-02-01
  label: People
  title: Dustin Wright joins AAU NLP
  text: Dustin brings an independent programme on reliable information and sustainable AI, including factuality, scientific fact-checking, efficiency, and environmental impacts.
  url: /people/dustin-wright/

