- date: 2026-09-04
  label: People
  title: Six new researchers join AAU NLP
  text: Since 1 June, Ren Tao, Anahita Baninajjar, Dorielle Lonke, Anna Lackner, Davis Davalos-DeLosh, and Lena Pickartz have joined the group, strengthening our work in linguistics, trustworthy AI, and language-model security.
  url: /people/

- date: 2026-08-24
  label: Publications
  title: Five papers at EMNLP 2026
  text: Four Main Conference papers span multilingual language modelling, vision-language models, embedding security, and epistemic diversity. They include Tao's first paper and the final PhD thesis papers for Marcell and Yiyi. A fifth contribution was accepted to the System Demonstrations track.
  url: https://bjerva.github.io/publications/

- date: 2026-05-01
  label: Projects
  title: Two new programmes begin
  text: TRUST and Formal Semantic Methods for AI Safety strengthen the group's work on model integrity, formal semantics, multilingual failure analysis, and explainable safeguards.
  url: /projects/

- date: 2026-03-01
  label: Publication
  title: Typologically principled evaluation in Computational Linguistics
  text: A Principled Framework for Evaluating on Typologically Diverse Languages provides reproducible tools for choosing language samples and testing generalisability.
  url: https://aclanthology.org/2026.cl-1.7/

- date: 2026-02-01
  label: People
  title: Dustin Wright joins AAU NLP
  text: Dustin brings an independent programme on reliable information and sustainable AI, including factuality, scientific fact-checking, efficiency, and environmental impacts.
  url: /people/dustin-wright/

- date: 2025-11-26
  label: Milestone
  title: Esther Ploeger completes the first AAU NLP PhD
  text: Esther defended her thesis on linguistic typology and multilingual NLP, marking an important milestone for the group.
  url: https://www.cs.aau.dk/phd-defence-by-esther-ploeger-e154093

